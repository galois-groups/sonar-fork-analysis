name: 'Build a fixture'
description:
  'Sets up what a fixture needs and runs its tests, as a workflow does before
  the action.'
inputs:
  fixture:
    description: 'The fixture: maven, gradle, npm, pnpm, python or infra.'
    required: true
runs:
  using: composite
  # It restores the setup actions' caches, so never in a job that analyses pull request code with the
  # token.
  steps:
    - name: 'Set up Java'
      if: inputs.fixture == 'maven' || inputs.fixture == 'gradle'
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version-file: .java-version
        cache: ${{ inputs.fixture }}

    # The pnpm the fixture's packageManager names. Before Node, whose cache looks for it.
    - name: 'Set up pnpm'
      if: inputs.fixture == 'pnpm'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: fixtures/pnpm/package.json

    - name: 'Set up Node'
      if: inputs.fixture == 'npm' || inputs.fixture == 'pnpm'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.fixture }}
        cache-dependency-path:
          fixtures/${{ inputs.fixture }}/${{ case(inputs.fixture == 'pnpm',
          'pnpm-lock.yaml', 'package-lock.json') }}

    - name: 'Test the npm fixture'
      if: inputs.fixture == 'npm'
      shell: bash
      working-directory: fixtures/npm
      run: |
        # The fixture needs no install scripts, and none may touch the steps that follow.
        npm ci --ignore-scripts --no-audit --no-fund
        npm test

    - name: 'Test the pnpm fixture'
      if: inputs.fixture == 'pnpm'
      shell: bash
      working-directory: fixtures/pnpm
      run: |
        pnpm install --frozen-lockfile
        pnpm -r test

    - name: 'Set up Python'
      if: inputs.fixture == 'python'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: fixtures/python/.python-version

    # In the project's own virtual environment, where the action looks for pysonar first.
    - name: 'Test the Python fixture'
      if: inputs.fixture == 'python'
      shell: bash
      working-directory: fixtures/python
      run: |
        python -m venv .venv
        if [ "$RUNNER_OS" = Windows ]; then bin=.venv/Scripts; else bin=.venv/bin; fi
        "$bin/python" -m pip install --require-hashes --no-deps -r requirements.txt
        "$bin/python" -m pytest
