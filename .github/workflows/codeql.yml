name: 'CodeQL'
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '31 7 * * 3'
permissions: {}
jobs:
  analyze:
    name: 'Analyze ${{ matrix.language }}'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # actions covers the workflow files, where injection bugs like v1's live.
        language: [javascript-typescript, actions]
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Initialize CodeQL'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore:
              - dist
              - fixtures

      - name: 'Perform CodeQL analysis'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
