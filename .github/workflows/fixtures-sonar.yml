# Analyses the fixtures prepared by the 'Fixtures' workflow, the way a pull request from a fork is.
#
# The analysis holds the Sonar token, so it must never run code from the analysed commit: see
# fork-path.yml.
name: 'Fixtures Sonar'
# The fork path needs this trigger, and nothing here runs the analysed code (see above).
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Fixtures]
    types:
      - completed
permissions: {}
jobs:
  analyze:
    name: 'Fork path'
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: read
      pull-requests: read
      # Lets the action report the analysis on the analysed commit, where the pull request shows it.
      statuses: write
    # Loaded from this workflow's commit, main's, never from the analysed one.
    uses: ./.github/workflows/fork-path.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
