# Analyses the test fixtures with the action as it is in this pull request.
#
# Must stay on 'pull_request', never 'pull_request_target': on fork pull requests GitHub withholds the
# Sonar token here, which is what keeps fork code away from it.
name: 'Fixtures'
on:
  push:
    branches:
      - main
  pull_request:
# A pull request's comparison waits for SonarCloud's analysis of its commit, which a newer push replaces:
# the older run could only time out.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  direct:
    name: 'Analyse ${{ matrix.fixture }} directly'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: maven
            name: Maven
          - fixture: gradle
            name: Gradle
          - fixture: npm
            name: Npm
          - fixture: pnpm
            name: Pnpm
    env:
      # Forks and Dependabot get no Actions secrets, and a forced direct analysis fails without the
      # token, so skip it there.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      # The pull request's head, not GitHub's merge commit: the fork path analyses the head, and both
      # sides must analyse the same code to be compared.
      - name: 'Checkout project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 'Set up Java'
        if: matrix.fixture == 'maven' || matrix.fixture == 'gradle'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: ${{ matrix.fixture }}

      # The pnpm the fixture's packageManager names. Before Node, whose cache looks for it.
      - name: 'Set up pnpm'
        if: matrix.fixture == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: fixtures/pnpm/package.json

      # The action runs no build for the scanner, so the workflow builds and tests first, as users do.
      - name: 'Set up Node'
        if: matrix.fixture == 'npm' || matrix.fixture == 'pnpm'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: ${{ matrix.fixture }}
          cache-dependency-path:
            fixtures/${{ matrix.fixture }}/${{ matrix.fixture == 'pnpm' &&
            'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: 'Test the npm fixture'
        if: matrix.fixture == 'npm'
        working-directory: fixtures/npm
        run: |
          # The fixture needs no install scripts, and none may touch the steps that follow.
          npm ci --ignore-scripts
          npm test

      - name: 'Test the pnpm fixture'
        if: matrix.fixture == 'pnpm'
        working-directory: fixtures/pnpm
        run: |
          pnpm install --frozen-lockfile
          pnpm -r test

      # What the Sonar plugin downloads from SonarCloud (engine, Java runtime, analyzers), as Sonar's own
      # CI examples cache it. A fresh entry each week, so it doesn't fill up with old engines. Never in
      # Fixtures Sonar: its job holds the token, and the scanner doesn't re-check what it finds here.
      - name: "Pick this week's Sonar cache"
        if: env.HAS_SONAR_TOKEN == 'true'
        id: sonar-cache
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: 'Restore the Sonar cache'
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-${{ matrix.fixture }}-${{ steps.sonar-cache.outputs.week }}

      - name: 'Analyse with Sonar'
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: $/
        with:
          mode: direct
          working-directory: fixtures/${{ matrix.fixture }}
          project-key:
            galois-groups_sonar-fork-analysis_${{ matrix.fixture }}_direct
          sonar-organization: galois-groups
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          # SonarCloud names a project after the build (fixture-maven, fixture-gradle) and labels its PR
          # check with that name, so the direct and split projects of a fixture would post same-named
          # checks that GitHub merges into one.
          build-arguments:
            -Dsonar.projectName=Sonar fork analysis - ${{ matrix.name }} direct

  prepare:
    name: 'Prepare ${{ matrix.fixture }} for the fork path'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [maven, gradle, npm, pnpm]
    steps:
      # The head, like analyze checks out, so the shipped build output matches the analysed sources.
      - name: 'Checkout project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 'Set up Java'
        if: matrix.fixture == 'maven' || matrix.fixture == 'gradle'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: ${{ matrix.fixture }}

      # The pnpm the fixture's packageManager names. Before Node, whose cache looks for it.
      - name: 'Set up pnpm'
        if: matrix.fixture == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: fixtures/pnpm/package.json

      # The action runs no build for the scanner, so the workflow builds and tests first, as users do.
      - name: 'Set up Node'
        if: matrix.fixture == 'npm' || matrix.fixture == 'pnpm'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: ${{ matrix.fixture }}
          cache-dependency-path:
            fixtures/${{ matrix.fixture }}/${{ matrix.fixture == 'pnpm' &&
            'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: 'Test the npm fixture'
        if: matrix.fixture == 'npm'
        working-directory: fixtures/npm
        run: |
          # The fixture needs no install scripts, and none may touch the steps that follow.
          npm ci --ignore-scripts
          npm test

      - name: 'Test the pnpm fixture'
        if: matrix.fixture == 'pnpm'
        working-directory: fixtures/pnpm
        run: |
          pnpm install --frozen-lockfile
          pnpm -r test

      - name: 'Prepare the analysis'
        uses: $/
        with:
          mode: prepare
          project-key:
            galois-groups_sonar-fork-analysis_${{ matrix.fixture }}_split
          working-directory: fixtures/${{ matrix.fixture }}

  # Analyses the prepared artifact in the same run, so changes to analyze mode are tested before they
  # reach main (Fixtures Sonar only ever runs main's copy of itself).
  analyze:
    name: 'Analyse ${{ matrix.fixture }} from the prepared artifact'
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: maven
            name: Maven
          - fixture: gradle
            name: Gradle
          - fixture: npm
            name: Npm
          - fixture: pnpm
            name: Pnpm
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    # No checkout step: the action checks out the analysed commit itself, as it does for users.
    steps:
      # The same traps as Fixtures Sonar's, which only ever runs main's copy of itself: here they also
      # catch a pull request's own changes before they reach main.
      - name: 'Set traps'
        # The PATH entry is the directory created here, holding nothing but the stand-ins.
        run: | # zizmor: ignore[github-env]
          mkdir -p "$RUNNER_TEMP/traps"
          for tool in mvn gradle npm npx yarn pnpm cargo go python python3 pip pip3 poetry uv sbt java javac wget curl docker podman kubectl helm terraform tofu ansible ansible-playbook ansible-lint cfn-lint aws az bicep shellcheck pwsh powershell; do
            printf "#!/bin/sh\necho \"\$0 \$*\" >> \"%s\"\nexit 1\n" "$RUNNER_TEMP/traps/sprung" > "$RUNNER_TEMP/traps/$tool"
            chmod +x "$RUNNER_TEMP/traps/$tool"
          done
          # The fixtures' wrappers stay as Maven and Gradle generate them. They start Java through JAVA_HOME.
          # The analysis step points JAVA_HOME here. Before that, mvnw downloads Maven with wget or curl.
          mkdir -p "$RUNNER_TEMP/traps/jdk/bin"
          cp "$RUNNER_TEMP/traps/java" "$RUNNER_TEMP/traps/javac" "$RUNNER_TEMP/traps/jdk/bin/"
          # SonarCloud's engine runs dotnet build -version for its analytics, in the working directory the
          # action gives the scanner; anywhere else, e.g. the checkout or the unpacked artifact, dotnet
          # would read the pull request's global.json.
          printf "#!/bin/sh\ncase \"\$PWD/\" in \"%s\"/sonar-fork-analysis-??????/run/) ;; *) echo \"dotnet \$* in \$PWD\" >> \"%s\";; esac\nexit 1\n" \
            "$RUNNER_TEMP" "$RUNNER_TEMP/traps/sprung" > "$RUNNER_TEMP/traps/dotnet"
          chmod +x "$RUNNER_TEMP/traps/dotnet"
          echo "$RUNNER_TEMP/traps" >> "$GITHUB_PATH"

      # Kernel audit records every program the runner starts while the analysis runs. The launches job
      # checks them, since this job can't run this repository's scripts.
      - name: 'Record program starts'
        id: record
        if: env.HAS_SONAR_TOKEN == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q auditd
          # The stop step checks this counter, which otherwise counts from the machine's start.
          sudo auditctl --reset-lost
          # Program starts and the forks that link each one to its parent. A process could switch to the
          # 32-bit calls to pass unseen.
          for arch in b64 b32; do
            sudo auditctl -a always,exit -F arch=$arch -S execve,execveat,clone,clone3,fork,vfork -F success=1 -k sonar-fork-analysis
          done

      - name: 'Analyse with Sonar'
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: $/
        env:
          SONAR_FORK_ANALYSIS_TRAP: ${{ runner.temp }}/traps/sprung
          JAVA_HOME: ${{ runner.temp }}/traps/jdk
        with:
          mode: analyze
          project-key:
            galois-groups_sonar-fork-analysis_${{ matrix.fixture }}_split
          sonar-organization: galois-groups
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          build-arguments:
            -Dsonar.projectName=Sonar fork analysis - ${{ matrix.name }} split

      - name: 'Stop recording'
        id: stop
        if: always() && steps.record.outcome == 'success'
        # Written out, bash runs with pipefail: a failing ausearch fails the step.
        shell: bash
        run: |
          sudo auditctl -D -k sonar-fork-analysis
          lost="$(sudo auditctl -s | awk '$1 == "lost" { print $2 }')"
          if [ "$lost" != 0 ]; then
            echo "::error::The kernel lost $lost audit records."
            exit 1
          fi
          # Stopping the service writes out the records it still holds.
          sudo service auditd stop
          sudo ausearch --input-logs --raw -k sonar-fork-analysis | tee "$RUNNER_TEMP/launches-$FIXTURE.log" > /dev/null
          # Anyone can download the artifact, so the records must not hold the token, in plain or hexadecimal.
          hex="$(printf %s "$SONAR_TOKEN" | od -An -tx1 | tr -d ' \n' | tr a-f A-F)"
          if grep -q -F -e "$SONAR_TOKEN" -e "$hex" "$RUNNER_TEMP/launches-$FIXTURE.log"; then
            rm "$RUNNER_TEMP/launches-$FIXTURE.log"
            echo '::error::The audit records hold the Sonar token.'
            exit 1
          fi
        env:
          FIXTURE: ${{ matrix.fixture }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: 'Upload the program starts'
        if: always() && steps.stop.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launches-${{ matrix.fixture }}
          path: ${{ runner.temp }}/launches-${{ matrix.fixture }}.log
          retention-days: 3
          if-no-files-found: error

      - name: 'Check the traps'
        if: always()
        run: |
          if [ -e "$RUNNER_TEMP/traps/sprung" ]; then
            echo '::error::The analysis ran build tools:'
            # The recorded lines come from the analysed code's reach; none may pass for a workflow command.
            resume="$(cat /proc/sys/kernel/random/uuid)"
            echo "::stop-commands::$resume"
            cat "$RUNNER_TEMP/traps/sprung"
            echo "::$resume::"
            exit 1
          fi

  # Runs this pull request's copy of the check, without the token.
  launches:
    name: 'Check the programs the fork path started'
    needs: analyze
    if: ${{ !cancelled() && needs.analyze.result != 'skipped' }}
    runs-on: ubuntu-latest
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up Node'
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: 'Download the program starts'
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: launches-*
          path: ${{ runner.temp }}/launches
          merge-multiple: true

      - name: 'Check them against the allowlist'
        if: env.HAS_SONAR_TOKEN == 'true'
        run:
          node scripts/check-launches.ts .github/fork-path-programs.txt
          "$RUNNER_TEMP"/launches/*.log

  # What differs on other systems: the wrappers' Windows scripts (mvnw.cmd, gradlew.bat), and the
  # scanner the action downloads for each. Prepare runs the same build as a direct analysis without the
  # token. Nothing analyses its artifact.
  other-systems:
    name: 'Prepare ${{ matrix.fixture }} on ${{ matrix.name }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: maven
            os: windows-latest
            name: Windows
          - fixture: gradle
            os: windows-latest
            name: Windows
          - fixture: npm
            os: windows-latest
            name: Windows
          - fixture: npm
            os: macos-latest
            name: macOS
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 'Set up Java'
        if: matrix.fixture == 'maven' || matrix.fixture == 'gradle'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: ${{ matrix.fixture }}

      - name: 'Set up Node'
        if: matrix.fixture == 'npm'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: fixtures/npm/package-lock.json

      - name: 'Test the npm fixture'
        if: matrix.fixture == 'npm'
        working-directory: fixtures/npm
        run: |
          npm ci --ignore-scripts
          npm test

      # The runner comes with Maven and Gradle, so the build would pass without the wrapper too. These
      # stand-ins come first on the PATH and fail it.
      - name: 'Set traps'
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $traps = (New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'traps')).FullName
          foreach ($tool in 'mvn', 'gradle') {
            Set-Content -Path (Join-Path $traps "$tool.cmd") -Value "@echo The action ran $tool, not the wrapper & exit /b 1"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $traps

      - name: 'Prepare the analysis'
        uses: $/
        with:
          mode: prepare
          project-key:
            galois-groups_sonar-fork-analysis_${{ matrix.fixture }}_${{
            runner.os }}
          working-directory: fixtures/${{ matrix.fixture }}

  # Fails when the fork path loses anything a direct analysis finds. On pull requests Sonar only keeps
  # issues on changed lines, so the full comparison happens on main.
  compare:
    name: 'Compare the ${{ matrix.fixture }} analyses'
    needs: [direct, analyze]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [maven, gradle, npm, pnpm]
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node runs the TypeScript script directly from 22.18; the runner may have an older one.
      - name: 'Set up Node'
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: 'Compare direct and fork path results'
        if: env.HAS_SONAR_TOKEN == 'true'
        run: >
          node scripts/compare-analyses.ts galois-groups_sonar-fork-analysis_${{
          matrix.fixture }}_direct galois-groups_sonar-fork-analysis_${{
          matrix.fixture }}_split
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          # What SonarQube Cloud records for both paths: the pull request's head, or the pushed commit.
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          # The fork path only analyses the languages the action is tested with.
          DIRECT_ONLY:
            ${{ matrix.fixture == 'npm' && 'packages/app/src/decoy.py' || '' }}
          LANGUAGES: java,kotlin,js,ts,css,web,xml,yaml,json,docker,terraform,azureresourcemanager,shell,powershell
