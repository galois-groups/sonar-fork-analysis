# Points the major tag at each new release: v2 for v2.1.0. Immutable releases lock the release's own
# tag, so the major tag is a plain tag that only this workflow moves.
name: 'Release'
on:
  release:
    types:
      - released
permissions: {}
jobs:
  major-tag:
    name: 'Move the major tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: 'Move the major tag'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = context.payload.release.tag_name;
            const match = /^(v\d+)\.\d+\.\d+$/.exec(tag);
            if (!match) {
              core.setFailed(`${tag} isn't a vX.Y.Z version.`);
              return;
            }
            const major = match[1];
            const { data: latest } = await github.rest.repos.getLatestRelease(context.repo);
            if (latest.tag_name !== tag) {
              core.setFailed(
                `${tag} isn't the latest release, so ${major} stays where it is. The latest is ${latest.tag_name}.`,
              );
              return;
            }
            const ref = `tags/${major}`;
            try {
              await github.rest.git.getRef({ ...context.repo, ref });
              await github.rest.git.updateRef({ ...context.repo, ref, sha: context.sha, force: true });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ ...context.repo, ref: `refs/${ref}`, sha: context.sha });
            }
