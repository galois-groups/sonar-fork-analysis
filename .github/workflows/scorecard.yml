# Rates the repository's supply-chain security with OpenSSF Scorecard: branch protection, pinned
# dependencies, token permissions, and more. Findings go to code scanning; the score is published
# for the README badge.
#
# Publishing restricts what this workflow may contain: no top-level env or defaults, and only the
# steps below in the job.
name: 'Scorecard'
on:
  # Not on push: Scorecard only accepts the Gradle wrapper jar once CI has passed on the scanned commit,
  # and on push it runs before CI finishes.
  schedule:
    - cron: '23 4 * * 1'
  # Re-rates as soon as the branch rules change.
  branch_protection_rule:
  workflow_dispatch:
permissions: {}
jobs:
  analysis:
    name: 'Rate supply-chain security'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      # Proves to the Scorecard API that the results come from this repository's workflow.
      id-token: write
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run Scorecard'
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: 'Upload to code scanning'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
