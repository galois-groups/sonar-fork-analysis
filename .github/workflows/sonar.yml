# Analyses this repository's pull requests from forks and Dependabot, which the CI workflow prepared
# without the Sonar token: the action's own fork path, set up as the README describes.
#
# This job holds the token, so it must never run code from the analysed commit. The action is the
# released one, pinned by commit. It checks out the analysed commit itself, which the scanner then only
# reads.
name: 'Sonar'
# The fork path needs this trigger, and nothing here runs the analysed code (see above).
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types:
      - completed
permissions: {}
jobs:
  analyze:
    name: 'Analyse on the fork path'
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      # Lets the action report the analysis on the analysed commit, where the pull request shows it.
      statuses: write
    steps:
      - name: 'Analyse with Sonar'
        uses: galois-groups/sonar-fork-analysis@e1bb6680448bbe2646e1ef3a3245c3d6ac52c4bc # v2.1.0
        with:
          project-key: galois-groups_sonar-fork-analysis
          sonar-organization: galois-groups
          sonar-token: ${{ secrets.SONAR_TOKEN }}
