# Samples of every other file type the action analyses, in a project without a Maven, Gradle or Node
# build: the plain scanner analyses it from this file.
sonar.sources=.
# Nothing here has tests.
sonar.coverage.exclusions=**
# Settings the fork path must carry from the build, or its analysis differs. COBOL has no default
# file suffixes.
sonar.cobol.file.suffixes=cbl,cpy
sonar.cobol.copy.suffixes=cpy
sonar.cobol.copy.directories=cobol/copybooks
sonar.rpg.leftMarginWidth=0
