# An npm workspaces monorepo: each package is a module. The npm scanner only reads this file, so each
# package's settings are here too, under its module's prefix.
sonar.modules=shared,app

shared.sonar.projectBaseDir=packages/shared
# Tests sit next to the code, so only their file names tell them apart.
shared.sonar.sources=src
shared.sonar.tests=src
shared.sonar.test.inclusions=**/*.test.ts
# The engine leaves test files out of the sources anyway, but warns unless the module excludes them itself.
shared.sonar.exclusions=**/*.test.ts
shared.sonar.javascript.lcov.reportPaths=coverage/lcov.info

app.sonar.projectBaseDir=packages/app
# The whole package, as many Node projects do, so the fork path must bring the coverage report and the
# type declarations into the sources.
app.sonar.sources=.
app.sonar.exclusions=test/**,coverage/**
app.sonar.tests=test
app.sonar.javascript.lcov.reportPaths=coverage/lcov.info
# No test can cover these: Node's test runner can't load them.
app.sonar.coverage.exclusions=**/*.tsx,**/*.vue
