# This repository analysed by its own action. The scripts have no tests, so no coverage either.
# The npm scanner would name the project after package.json, which renames its pull request check.
sonar.projectName=Sonar fork analysis
sonar.sources=src,scripts
sonar.tests=__tests__,__fixtures__
sonar.coverage.exclusions=scripts/**
# The scanner probe is a Java helper for the tests. This project builds no Java, so Sonar would warn
# that its classes are missing.
sonar.test.exclusions=__tests__/java/**
# The npm scanner finds the coverage report in coverage/lcov.info by itself.
